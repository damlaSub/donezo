name: Frontend CD

on:
  push:
    branches:
      - main
    paths:
      - 'donezo-ui/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show working directory before install
        run: |
          pwd
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: donezo-ui
        run: |
          pwd
          ls -la
          npm ci

      - name: Build project
        working-directory: donezo-ui
        run: |
          pwd
          ls -la
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: donezo-ui/build
