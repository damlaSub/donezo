name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'donezo-api/**'
      - 'donezo/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: donezo-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show current directory and list files
        run: |
          pwd
          ls -la

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Render CLI
        run: npm install -g render-cli

      - name: Log in to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: render login --api-key $RENDER_API_KEY

      - name: Build Docker image
        run: docker build -t donezo-api .

      - name: Deploy to Render
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DONEZO_API_AUTH_SECRET: ${{ secrets.JWT_SECRET }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          PROD_BASIC_AUTH_USER: ${{ secrets.PROD_BASIC_AUTH_USER }}
          PROD_BASIC_AUTH_PASSWORD: ${{ secrets.PROD_BASIC_AUTH_PASSWORD }}
        run: |
          render services deploy $RENDER_SERVICE_ID --image donezo-api

