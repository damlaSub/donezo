name: Frontend CI

on:
  push:
    branches:
      - develop
    paths:
      - 'donezo-ui/**'
      - 'donezo/**'
  pull_request:
    branches:
      - develop
    paths:
      - 'donezo-ui/**'
      - 'donezo/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: donezo-ui
        run: npm install

      - name: Build project
        working-directory: donezo-ui
        run: npm run build
