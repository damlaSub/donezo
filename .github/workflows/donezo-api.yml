name: Backend CI

on:
  push:
    branches: [develop]
    paths:
      - 'donezo-api/**'
      - 'donezo/**'
  pull_request:
    branches: [develop]
    paths:
      - 'donezo-api/**'
      - 'donezo/**'
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test
      DONEZO_API_AUTH_SECRET: ${{ secrets.JWT_SECRET }}

    defaults:
      run:
        working-directory: donezo-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw 

      - name: Clean and run tests
        run: ./mvnw clean test
