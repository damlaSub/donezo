name: Frontend CI

on:
  push:
    branches:
      - develop
    paths:
      - 'donezo-ui/**'
      - 'donezo/**'
  pull_request:
    branches:
      - develop
    paths:
      - 'donezo-ui/**'
      - 'donezo/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: donezo-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: donezo-ui/package-lock.json

      - name: Clean install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
